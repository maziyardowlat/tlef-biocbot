const MARKDOWN = "# BiocBot Chat Export Change Log\n\n_Changes that affect what you see in a downloaded student chat_\n\nLast updated: 2026-08-20\n\nThis document lists the changes we have made to BiocBot that change what a downloaded student chat contains, or how it should be read. It is meant to be read alongside the export guide included at the end of this document.\n\nExports are generated from the stored session when you press Download, so a chat that was recorded before a change listed here still reflects the behaviour of the app at the time it happened. Downloading it again today does not retroactively correct it. Each entry therefore says both what newer exports look like and what to expect in exports of older sessions.\n\nDates are the date the change landed in the BiocBot codebase. A change reaches your course when the app is next deployed, which may be slightly later.\n\n---\n\n## Changes\n\n### 2026-08-03 — New chats start in Tutor mode, and later mode switches are recorded\n\n**Area:** Teaching mode\n\nA new chat begins in Tutor mode unless the student has deliberately used the mode toggle before, and a first-time student who finishes the walkthrough is left in Tutor mode rather than being placed straight into Protege mode. Students who pass the assessment are still offered Protege mode, and many of them switch back to Tutor immediately.\n\n**What you see in exports now:** In the JSON, 'metadata.currentMode' is the mode the session was in at export time, which is not necessarily the mode the assessment chose. The 'mode-result' message records the mode the assessment determined, in 'modeData.determinedMode'. If the student changed it afterwards, a separate 'mode-toggle-result' message records that change. Read the three together before concluding that a student was mis-assigned.\n\n**In exports of earlier sessions:** Older sessions can show a student being placed in Protege mode at the start of their very first chat, before they had any chance to choose.\n\n**Reference:** Issue #463, Issue #458, commit 6bafdde\n\n### 2026-07-31 — Reloading a chat no longer replays earlier turns into the conversation\n\n**Area:** Reload and session restore\n\nHow a chat is restored and auto-saved after a browser refresh was reworked between 2026-07-14 and 2026-07-31. A refreshed session could previously rebuild its context in a way that presented one of BiocBot's own earlier replies to the model in the position normally held by student text, and could re-add an assessment question the student had already answered.\n\n**What you see in exports now:** A session that was refreshed exports the same messages that were on screen: no duplicated assessment question, and no bot turn that treats an earlier bot reply as something the student wrote.\n\n**In exports of earlier sessions:** In exports of sessions refreshed before this fix you may see two consecutive BIOCBOT turns where the second one praises 'you' - for example 'You explained it perfectly' or 'You summarised that explanation perfectly'. That is BiocBot reacting to its own previous message. It is a poorly constructed response, not evidence that a student turn is missing from the export.\n\n**Reference:** commit 562bdf2, commit 95ba39b\n\n### 2026-07-23 — The assessment score card now matches the stored answers\n\n**Area:** Assessment scoring\n\nThe summary card shown at the end of the assessment could display the wrong total - for example 1/3 for a student who had actually answered 3 of 3 correctly - even though the stored answers and the stored score were correct. Scoring was moved into a single shared module used by the chat, the stored session and the export, so all three agree. A repair script (scripts/repair-assessment-summaries.js, dry-run by default) can correct summaries that were already stored.\n\n**What you see in exports now:** The score shown in the 'mode-result' message agrees with the per-question records in 'practiceTests' and 'studentAnswers'.\n\n**In exports of earlier sessions:** If an older export shows a 'mode-result' score card that disagrees with 'practiceTests', the per-question records in 'practiceTests' and 'studentAnswers' are the reliable ones - the student's answers were always stored correctly.\n\n**Reference:** Issue #459, commit 4a6decd\n\n### 2026-07-23 — A completed assessment is saved as soon as it finishes\n\n**Area:** Assessment scoring\n\nThe finished assessment result is written to the server as soon as it appears on the student's screen, instead of waiting for the student's next chat message to trigger a save.\n\n**What you see in exports now:** A session where the student took the assessment and then stopped still exports with its questions, answers and mode result.\n\n**In exports of earlier sessions:** A student who completed the assessment and then left without chatting could produce a session with no record of the assessment.\n\n**Reference:** commit 4a6decd\n\n### 2026-07-14 — Explain responses are labelled and linked to the message they explain\n\n**Area:** Explain button\n\nWhen a student clicks Explain, the interface sends BiocBot's preceding reply back to the model as a background request. Clicking the button does not create or save a student turn, and never did. Explain-generated replies are now marked so you can tell them apart from ordinary replies.\n\n**What you see in exports now:** In the JSON, an Explain reply carries 'triggeredBy': 'explain_button', 'actionStatus': 'success', and 'sourceMessageId' pointing at the bot message the student asked BiocBot to explain. In the TXT transcript it still appears as a BIOCBOT turn with no student turn before it, which is expected for a button-triggered reply.\n\n**In exports of earlier sessions:** Explain replies were indistinguishable from ordinary replies, so a bot turn with no preceding student turn looked like missing data.\n\n**Reference:** Issue #447, commit 95ba39b\n\n### 2026-07-14 — Summarize is recorded as a session event\n\n**Area:** Summarize button\n\nA successful Summarize click is logged in the session's 'events' array, and the summarised session's end time is updated to the time of the click.\n\n**What you see in exports now:** The JSON gains an optional top-level 'events' array. A Summarize event has 'type': 'button_action', 'triggeredBy': 'summarize_button' and 'actionStatus': 'success' with its own timestamp. It is absent when a session has no session-level actions.\n\n**In exports of earlier sessions:** Summarize left no trace in the export. A session simply ended, and the next one opened with a long, polished message attributed to the student.\n\n**Reference:** Issue #449, commit 95ba39b\n\n### 2026-07-14 — Message timing survives reloads, and reconstructed timing is flagged\n\n**Area:** Timing fields\n\nEach message's 'elapsedTime' - the gap in milliseconds since the previous message - is stored with the message and preserved when the chat is reopened from History or restored after a reload. Intervals that had to be rebuilt from stored timestamps for older records are flagged rather than silently mixed in.\n\n**What you see in exports now:** 'elapsedTime' reflects when the conversation actually happened. 'elapsedTimeDerived': true marks an interval reconstructed from timestamps; false marks one captured as the message was created. 'sessionInfo.duration' measures from the first student message to the last real bot response, so it excludes the welcome and assessment at the start.\n\n**In exports of earlier sessions:** Reopening an older chat could overwrite its intervals with the time of the reload, so some gaps in older exports describe when the chat was viewed rather than when it happened. Check 'elapsedTimeDerived' before relying on a gap.\n\n**Reference:** commit 95ba39b\n\n### 2026-07-13 — Chats end after a configurable period of inactivity\n\n**Area:** Session boundaries\n\nInstructor Settings has a 'Chat session inactivity timeout (minutes)' setting, defaulting to 30 minutes. After that much inactivity, a returning student automatically starts a new chat and repeats the unit assessment. Their previous chat remains in their History.\n\n**What you see in exports now:** One student's work on a single unit routinely spans several session files. Order them by 'sessionInfo.startTime' and read them in sequence. Seeing the same unit's assessment repeated across those files is expected, not duplicated data.\n\n**In exports of earlier sessions:** Session breaks were governed by the earlier, less predictable timeout handling, so the number of sessions per student is not directly comparable across this date.\n\n**Reference:** commit c7e4b59\n\n### 2026-06-26 — Summarize and New chat split long conversations into linked sessions\n\n**Area:** Summarize button\n\nStudents can end a chat and carry an automatically generated recap into the next one, and the app does the same when a conversation reaches its message limit.\n\n**What you see in exports now:** The new session opens with a message of type 'user' whose 'isSummarySeed' is true. It is the generated recap, not something the student typed. A session created this way starts with that seed instead of the usual welcome and unit-selection message.\n\n**In exports of earlier sessions:** Not applicable - sessions before this date were not bridged by a summary.\n\n**Reference:** commit 1159af4, commit 958729e\n\n### 2026-06-26 — Students can rate BiocBot replies with a thumbs up or down\n\n**Area:** Student feedback\n\nA thumbs up / thumbs down control was added to BiocBot's replies so students can rate individual answers.\n\n**What you see in exports now:** Bot messages carry 'feedbackRating': 'up', 'down' or null when the student did not rate the reply. The rating is the student's opinion of that reply; it is never something BiocBot set.\n\n**In exports of earlier sessions:** Exports from before this date have no rating field, which means ratings were unavailable rather than withheld.\n\n**Reference:** commit 3ecbd0d\n\n---\n\n## Appendix: Interpreting the JSON Chat Export\n\n## Interpreting the JSON Chat Export\n\nWhen you download a student's chat from the **Downloads** page, you get two formats of the\nsame conversation:\n\n- **TXT** — a plain, readable transcript. It's self-explanatory: each message is a labeled\n  `STUDENT` / `BIOCBOT` block with a timestamp, HTML stripped out. If you just want to read\n  what was said, open this and you won't need this guide.\n- **JSON** — the full structured record, with every field the app tracks. Open this to\n  analyze the data, filter it in a spreadsheet or script, or understand *why* the bot\n  behaved a certain way.\n\nThis guide explains the **JSON** format, using a real exported session as the example.\n\n---\n\n### The shape of the file\n\nThe JSON is one object with a few top-level sections. Here's the whole shape:\n\n```\n{\n  \"metadata\":       { ...who, which course, which unit, how many messages... },\n  \"messages\":       [ ...every message, in order... ],\n  \"practiceTests\":  { ...the assessment questions and answers... },\n  \"studentAnswers\": { ...what the student selected... },\n  \"sessionInfo\":    { ...start/end time and duration... },\n  \"events\":         [ ...session-level button actions like \"summarize\"... ]\n}\n```\n\n`events` is optional and may be absent when the session has no recorded\nsession-level actions.\n\n#### `metadata` — the header\n\nTells you whose session this is and its scope. From the example:\n\n| Field | Meaning |\n|---|---|\n| `exportDate` | When this stored session record was last updated or assembled (UTC). In a combined download, the outer export object has a separate download-time `exportDate` |\n| `courseName` / `courseId` | The course |\n| `studentName` / `studentId` | The learner |\n| `unitName` | Which unit they were working in (e.g. `Unit 1`) |\n| `currentMode` | The bot's teaching mode at export time — `tutor` or `protege` |\n| `totalMessages` | How many messages are in this file |\n\n#### `messages` — the conversation\n\nAn array of message objects, oldest first. The two fields you'll always look at are\n`type` (`user` = student, `bot` = BiocBot) and `content` (the text). Everything else is\ncontext. The fields worth knowing:\n\n| Field | What it tells you |\n|---|---|\n| `type` | `user` (student) or `bot` (BiocBot) |\n| `content` | The message text |\n| `timestamp` | When it was sent (UTC) |\n| `messageType` | The *kind* of message — see the list below |\n| `feedbackRating` | The thumbs the **student** gave the bot's reply: `up`, `down`, or `null` (no rating) |\n| `sourceAttribution` | Which course materials the bot drew on for this reply (unit, document type). `null` for student messages |\n| `hasFlagButton` | Whether this message could be flagged for review |\n| `isHtml` | Whether `content` contains HTML markup |\n| `elapsedTime` | Milliseconds since the previous message — see [the timing section](#understanding-the-timing-fields) |\n| `elapsedTimeDerived` | Whether `elapsedTime` had to be reconstructed later from stored timestamps |\n| `questionData` | Present on assessment questions: the options and which one was selected |\n| `htmlContent` | The rich, formatted version of `content` (e.g. a score card) when one exists |\n| `triggeredBy` | If the message came from a button, which one (e.g. `explain_button`, `summarize_button`) |\n| `actionStatus` | Whether the button-triggered action succeeded; currently logged successful actions use `success` |\n| `sourceMessageId` | On an Explain response, the ID of the bot message the student asked BiocBot to explain |\n| `isSummarySeed` | `true` when this user-shaped message is an automatically generated recap carried into a new session |\n\n**`messageType` values you'll see:**\n\n- `regular-chat` — an ordinary message from student or bot.\n- `assessment-start` — the bot announcing the start of the pre-chat assessment.\n- `practice-test-question` — a question the student was asked. Look in `questionData`\n  for the options and the selected answer.\n- `mode-result` — the result of the assessment, including the score summary and which\n  mode the bot switched into. `modeData.determinedMode` gives the chosen mode.\n- `mode-toggle-result` — a notice recording a teaching-mode change made after the\n  assessment.\n- `unit-selection` — the one-time welcome/unit-selection message in a genuinely new\n  session. A session created by Summarize starts with its summary seed instead and does\n  not add this welcome message.\n\n**A note on system notices.** Messages like *\"You've reached 25 messages…\"* or\n*\"…after 15 messages, the quality of the responses might be degraded\"* appear as `bot`\nmessages with `sourceAttribution.source` set to `\"System\"`. These are automatic app\nnotices, **not** something the bot chose to say.\n\n#### `practiceTests` and `studentAnswers` — the assessment\n\nThese record the short quiz the student took before chatting. `practiceTests.questions`\nlists each question with its `correctAnswer`, the student's `studentAnswer`, and an\n`isCorrect` flag. `studentAnswers` is the raw record of what they selected. In the\nexample, the student answered `False` to a True/False question whose correct answer was\n`True`, so `isCorrect` is `false` and the score was `0/1`.\n\n#### `sessionInfo` and `events`\n\n- `sessionInfo.startTime` is the earliest valid message timestamp in the session.\n- `sessionInfo.endTime` is the session's last recorded activity time. A successful\n  Summarize action updates the old session's end time to the Summarize event timestamp.\n- `sessionInfo.duration` is the human-readable conversation duration (e.g. `\"3m 27s\"`).\n  It measures from the **first user message** through the **last real bot response**. It\n  excludes setup time before the first user message, such as a welcome or assessment,\n  and does not extend to a later system notice or Summarize click. The app adds the\n  relevant `elapsedTime` intervals when they are complete and falls back to the two\n  boundary timestamps for legacy sessions that do not have complete elapsed timing.\n- `sessionInfo.sessionId` identifies the session.\n- `events` logs session-level actions that do not need a synthetic transcript message.\n  A successful Summarize event has `type: \"button_action\"`,\n  `triggeredBy: \"summarize_button\"`, `actionStatus: \"success\"`, and its own timestamp.\n\nExplain is recorded differently because it produces a visible bot response. The response\nmessage itself has `triggeredBy: \"explain_button\"`, `actionStatus: \"success\"`, and a\n`sourceMessageId` linking it to the original bot message.\n\n---\n\n### Reading across two exports (sessions)\n\nA student's work is split into **sessions**. When the app hits a message limit or the\nstudent starts fresh, it opens a new session and carries a **summary** of the previous\none into the next. You'll see this in a pair of files:\n\n- The **first** session ends with a `summarize_button` event.\n- The **next** session opens with a student message whose `isSummarySeed` field is\n  `true`, `triggeredBy` is `summarize_button`, and `actionStatus` is `success`. This is\n  **not** something the student typed — it's the auto-generated recap of the earlier\n  session, injected so the bot keeps its context. If you see a long, polished \"student\"\n  message that summarizes the whole prior conversation, that's the seed. It is normally\n  the first message in the new session; a separate welcome message is not added.\n\nSo when two files look like they belong together, order them by `sessionInfo.startTime`\nand treat the `isSummarySeed` message as the bridge between them.\n\n---\n\n### Understanding the timing fields\n\n**`elapsedTime`** is the number of **milliseconds between a message and the one before it**\nin the conversation. The first message in a session is `0`, since nothing comes before\nit. This value is stored on the message and is preserved when a chat is reopened from\nhistory or restored after a reload; rendering an older chat does not replace its timing\nwith the reload time.\n\n**`elapsedTimeDerived`** records how that interval was obtained:\n\n- `false` — captured while the message was created and then preserved independently on\n  subsequent reloads and exports.\n- `true` — the message came from an older record without captured elapsed timing, so the\n  interval was reconstructed later from the stored timestamps. Once reconstructed, it is\n  also preserved rather than recalculated on each reload.\n\nDerived values are still usable and are intentionally included in `sessionInfo.duration`.\nThe flag provides provenance: if you are auditing legacy data whose historical timestamps\nmay themselves be questionable, you can distinguish reconstructed intervals from timing\ncaptured by the newer format.\n\nThe one thing to keep in mind is **what the gap includes**. It's raw wall-clock time since\nthe previous message, so:\n\n- a **bot** message's `elapsedTime` is roughly how long the bot took to respond, but\n- a **student** message's `elapsedTime` includes however long they spent reading the bot's\n  previous reply *and* typing their own.\n\nSo it is a message-to-message wall-clock gap, but it is **not** a clean measure of how long\nthe student was actively working. For newer records, prefer the persisted `elapsedTime`\nvalues when analyzing consecutive gaps; use UTC `timestamp` values when you need absolute\nclock times or custom boundaries. For legacy records, check `elapsedTimeDerived` so you\nknow whether a gap was reconstructed from those timestamps. `displayTimestamp` (for\nexample, `\"Just now\"`) is only the friendly label shown in the app; ignore it for analysis.\n\n---\n\n### Quick reference: is this the student or the bot?\n\nThis trips people up most, so to summarize:\n\n- **`type: \"user\"`** → the student typed it. **Exception:** a `user` message with\n  `isSummarySeed: true` is the auto-generated summary from a prior session, not the student.\n- **`type: \"bot\"`** → BiocBot. **Exception:** if `sourceAttribution.source` is\n  `\"System\"`, it's an automatic app notice, not the bot's own response.\n- **`feedbackRating`** on a bot message is the *student's* rating of that reply.\n";
window.fetch = async (url) => {
  if (false) {
    return { ok: true, status: 200, text: async () => MARKDOWN, headers: { get: () => 'attachment; filename="harness.md"' } };
  }
  if (false) {
    return { ok: true, status: 200, json: async () => ({ success: true, data: CHANGE_LOG }), headers: { get: () => null } };
  }
  return { ok: false, status: 404, json: async () => ({ success: false }), text: async () => '' };
};
